server:
  port: 8081

spring:
  application:
    name: servicio-clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:.env[.properties],optional:file:./servicio-clientes/.env[.properties]

statsig:
  server-secret: ${STATSIG_KEY}

# --- Observabilidad ---
management:
  tracing:
    sampling:
      # Trazar el 100% de las requests
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # Tag común a todas las métricas, para identificar esta app en Prometheus
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Histograma de latencias HTTP, necesario para calcular percentiles (p95) en Prometheus
        http:
          server:
            requests: true