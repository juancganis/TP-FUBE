server:
  port: 8082

spring:
  application:
    name: servicio-inventario
  datasource:
    url: jdbc:postgresql://localhost:5432/inventario_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# --- Observabilidad ---
management:
  tracing:
    sampling:
      # Trazar el 100% de las requests
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # Tag común a todas las métricas, para identificar esta app en Prometheus
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Histograma de latencias HTTP, necesario para calcular percentiles (p95) en Prometheus
        http:
          server:
            requests: true