server:
  port: 8083

spring:
  application:
    name: servicio-pedidos
  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc: # Crea automáticamente las tablas BATCH_* en postgreSQL si todavía no existen (sin tocar las tablas de los scripts de Flyway).
      initialize-schema: always
    job: # Evita que el Job se dispare solo cada vez que levantamos la app o corremos un test.
      enabled: false
servicios:
  clientes:
    url: http://localhost:8081
  inventario:
    url: http://localhost:8082