server:
  port: 8083

spring:
  application:
    name: servicio-pedidos
  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc: # Esto crea automáticamente las tablas BATCH_* en postgreSQL si todavía no existen (sin tocar las tablas de los scripts de Flyway).
      initialize-schema: always
    job: # Esto evita que el Job se dispare solo cada vez que levantamos la app o corremos un test.
      enabled: false

batch: # Creamos una propiedad personalizada que define el horario nocturno programado del cron.
  expiration: # El formato cron que usa Spring es segundos minutos horas día mes día-semana.
    cron: "0 0 2 * * *" # Esto se traduce a "todos los días a las 02:00 AM", para respetar un horario nocturno de baja carga.

servicios:
  clientes:
    url: http://localhost:8081
  inventario:
    url: http://localhost:8082

# --- Observabilidad ---
management:
  tracing:
    sampling:
      # Trazar el 100% de las requests
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      # Tag común a todas las métricas, para identificar esta app en Prometheus
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Histograma de latencias HTTP, necesario para calcular percentiles (p95) en Prometheus
        http:
          server:
            requests: true